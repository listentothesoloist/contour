apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: observability
  name: log-generator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: otel-course-generator:local
          imagePullPolicy: Never
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          resources:
            requests:
              cpu: "20m"
              memory: 32Mi
            limits:
              cpu: "150m"
              memory: 96Mi
