apiVersion: v1
kind: Service
metadata:
  namespace: observability
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: observability
  name: postgres
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: observability
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          env:
            - name: POSTGRES_DB
              value: "orders"
            - name: POSTGRES_USER
              value: "orders"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready","-U","orders","-d","orders"]
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command: ["pg_isready","-U","orders","-d","orders"]
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["pg_isready","-U","orders","-d","orders"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
